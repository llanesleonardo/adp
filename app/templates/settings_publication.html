{% extends "base.html" %}
{% block title %}Publication · Settings{% endblock %}
{% block content %}
<p class="crumbs"><a href="/settings">Settings</a> <span>/</span> <span>Publication</span></p>
<h1>Publication</h1>
<p class="lede">The name of this library and whether the public summary site is on.</p>
<section class="card">
  <form method="post" action="/settings/publication" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Organization name <input name="organization_name" value="{{ publication.organization_name }}" required></label>
    <label class="check"><input type="checkbox" name="public_site_enabled" value="yes" {% if publication.public_site_enabled %}checked{% endif %}> Public summary site enabled</label>
    <button type="submit">Save publication settings</button>
  </form>
</section>
{% endblock %}
