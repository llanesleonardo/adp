{% extends "base.html" %}
{% block title %}Subscribe{% endblock %}
{% block content %}
<section class="narrow card">
  <p class="eyebrow">Weekly email</p>
  <h1>Subscribe to the weekly news</h1>
  <p>One email a week with the public summaries a super admin has approved. A confirmation link arrives first. You can unsubscribe from any issue.</p>
  <form method="post" action="/subscribe" class="stack">
    <label>Email <input name="email" type="email" required></label>
    <label class="check"><input type="checkbox" name="consent" value="yes" required> I agree to receive the weekly email and can unsubscribe later.</label>
    <button type="submit">Subscribe</button>
  </form>
</section>
{% endblock %}
